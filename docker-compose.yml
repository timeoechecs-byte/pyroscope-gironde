# PyroScope 33 — Docker Compose
# docker compose up  → full stack
# docker compose up api worker → backend only (no frontend)

services:
  postgis:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: pyroscope
      POSTGRES_PASSWORD: pyroscope
      POSTGRES_DB: pyroscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyroscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pyroscope:pyroscope@postgis:5432/pyroscope
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://pyroscope:pyroscope@postgis:5432/pyroscope
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  front:
    build:
      context: .
      dockerfile: ./infra/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
